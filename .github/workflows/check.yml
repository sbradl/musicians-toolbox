name: check

on: push

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-${{ github.job }}-
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(basename "$ANDROID_NDK_HOME")"'
      - run: mise run lint
      - run: mise run test
      - run: mise run security
      - if: always()
        run: mise run security:sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: build/sarif
