name: package-tabfinder

on:
  push:
    paths:
      - apps/tabfinder/**
      - contexts/**
      - tools/**
      - build-logic/**
      - gradle/**
      - gradle.properties
      - gradlew
      - settings.gradle.kts
      - settings-gradle.lockfile
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - trivy.yaml
      - about.toml
      - .github/workflows/package-tabfinder.yml

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-${{ github.job }}-
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(basename "$ANDROID_NDK_HOME")"'
      - name: Unpack the release keystore
        run: printenv TABFINDER_KEYSTORE_BASE64 | base64 --decode > "$RUNNER_TEMP/tabfinder.p12"
        env:
          TABFINDER_KEYSTORE_BASE64: ${{ secrets.TABFINDER_KEYSTORE_BASE64 }}
      - run: mise run package:tabfinder
        env:
          MT_ANDROID_KEYSTORE: ${{ runner.temp }}/tabfinder.p12
          MT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TABFINDER_KEYSTORE_PASSWORD }}
          MT_ANDROID_KEY_ALIAS: tabfinder
      - run: xvfb-run -a mise run smoke:tabfinder
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabfinder
          path: build/package
          if-no-files-found: error

  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-${{ github.job }}-
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(basename "$ANDROID_NDK_HOME")"'
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          script: mise run test:android
        env:
          ORG_GRADLE_PROJECT_mtAndroidAbis: x86_64
