name: package-tabfinder

on:
  push:
    paths:
      - apps/tabfinder/**
      - contexts/**
      - tools/**
      - build-logic/**
      - gradle/**
      - gradle.properties
      - gradlew
      - settings.gradle.kts
      - settings-gradle.lockfile
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - trivy.yaml
      - about.toml
      - .github/workflows/package-tabfinder.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(basename "$ANDROID_NDK_HOME")"'
      - run: mise run package:tabfinder
      - run: xvfb-run -a mise run smoke:tabfinder
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabfinder
          path: build/package
          if-no-files-found: error

  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(basename "$ANDROID_NDK_HOME")"'
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          script: mise run test:android
