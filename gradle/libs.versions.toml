[versions]
kotlin = "2.4.21"
compose = "1.9.3"
compose-material3 = "1.9.0"
jna = "5.19.1"
junit = "4.13.2"
license-report = "3.1.5"
guava = "33.8.0-jre"
dbus-java = "5.2.2"
agp = "9.5.1"
android-compileSdk = "36"
android-minSdk = "29"
bouncycastle = "1.86"
commons-lang3 = "3.21.0"
httpclient = "4.5.14"
activity-compose = "1.13.0"
androidx-test-runner = "1.7.0"
androidx-compose-ui-test-manifest = "1.9.4"

[libraries]
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui-test-manifest" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport-native-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
license-report-gradle-plugin = { module = "com.github.jk1:gradle-license-report", version.ref = "license-report" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
