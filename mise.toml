[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy", targets = "aarch64-linux-android,x86_64-linux-android" }
java = "temurin-21.0.13+9.0.LTS"
ktlint = "1.8.0"
cargo-deny = "0.20.2"
trivy = "0.76.2"
opengrep = "1.33.1"
"github:bbqsrc/cargo-ndk" = "4.1.2"
zig = "0.17.1"
"github:rust-cross/cargo-zigbuild" = "0.24.1"
"github:EmbarkStudios/cargo-about" = "0.9.3"

[env]
ANDROID_HOME = "{{ env.ANDROID_HOME | default(value=env.HOME ~ '/Android/Sdk') }}"
ANDROID_NDK_HOME = "{{ env.ANDROID_HOME }}/ndk/28.2.13676358"

[vars]
opengrep_packs = "--config p/default --config p/owasp-top-ten --config p/security-audit --config p/rust --config p/kotlin --config p/github-actions --exclude-rule java.android.security.exported_activity.exported_activity"

[tasks.setup]
run = [
  "mise install",
  "git config core.hooksPath .githooks",
]

[tasks.fmt]
run = [
  "cargo fmt --all",
  "ktlint --format '**/*.kt' '**/*.kts' '!**/build/**'",
]

[tasks."lint:rustfmt"]
run = "cargo fmt --all --check"

[tasks."lint:clippy"]
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."lint:cargo-deny"]
run = "cargo deny --locked check bans"

[tasks."lint:opengrep"]
run = "opengrep scan --error --quiet --config .opengrep ."

[tasks."lint:ktlint"]
run = "ktlint '**/*.kt' '**/*.kts' '!**/build/**'"

[tasks.lint]
depends = ["lint:rustfmt", "lint:clippy", "lint:cargo-deny", "lint:opengrep", "lint:ktlint"]

[tasks."test:cargo"]
run = "cargo test --workspace --locked --quiet"

[tasks."test:gradle"]
run = "./gradlew check --quiet"

[tasks.test]
depends = ["test:cargo", "test:gradle"]

[tasks."security:opengrep"]
run = "opengrep scan --error --quiet {{vars.opengrep_packs}} ."

[tasks."security:trivy"]
run = "trivy fs --scanners vuln,secret ."

[tasks."security:cargo-deny"]
run = "cargo deny --locked check licenses"

[tasks."security:gradle-licenses"]
run = "./gradlew --no-parallel checkLicense"

[tasks.security]
depends = ["security:opengrep", "security:trivy", "security:cargo-deny", "security:gradle-licenses"]

[tasks."security:sarif"]
run = [
  "mkdir -p build/sarif",
  "opengrep scan --quiet {{vars.opengrep_packs}} --sarif-output=build/sarif/opengrep.sarif .",
  "trivy fs --exit-code 0 --scanners vuln,secret --format sarif --output build/sarif/trivy.sarif .",
]

[tasks.check]
depends = ["lint", "test", "security"]

[tasks."run:tabfinder"]
run = "./gradlew :apps:tabfinder:ui:desktop:run"

[tasks."android:tabfinder"]
run = [
  "./gradlew :apps:tabfinder:ui:android:installDebug",
  "$ANDROID_HOME/platform-tools/adb shell am start -n io.github.sbradl.tabfinder/.MainActivity",
]

[tasks."package:tabfinder"]
run = """
desktop_app_images=apps/tabfinder/ui/desktop/build/compose/binaries/main/app
android_release_apk=apps/tabfinder/ui/android/build/outputs/apk/release/android-release.apk
packages=build/package
[ -n "${MT_ANDROID_KEYSTORE:-}" ] || { echo "Set MT_ANDROID_KEYSTORE, MT_ANDROID_KEYSTORE_PASSWORD and MT_ANDROID_KEY_ALIAS to sign the release APK" >&2; exit 1; }
./gradlew :apps:tabfinder:adapters:ffi:checkGlibcFloor :apps:tabfinder:ui:desktop:createDistributable :apps:tabfinder:ui:desktop:thirdPartyNotices :apps:tabfinder:ui:android:assembleRelease
rm -rf $packages && mkdir -p $packages
cp apps/tabfinder/ui/desktop/build/third-party-notices/THIRD-PARTY-NOTICES.txt $desktop_app_images/TabFinder/
tar -czf $packages/tabfinder-linux-x86_64.tar.gz -C $desktop_app_images TabFinder
apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
signer=$("$apksigner" verify --print-certs $android_release_apk | grep "certificate DN")
if echo "$signer" | grep -q "CN=Android Debug"; then echo "The release APK is signed with the debug key" >&2; exit 1; fi
cp $android_release_apk $packages/tabfinder-android.apk
trivy fs --exit-code 0 --format cyclonedx --output $packages/tabfinder-sbom.cdx.json .
notices_name() { notices=$(cat); for library in "$@"; do echo "$notices" | grep -q -- "$library" || { echo "THIRD-PARTY-NOTICES.txt does not name $library" >&2; return 1; }; done; }
tar -xOzf $packages/tabfinder-linux-x86_64.tar.gz TabFinder/THIRD-PARTY-NOTICES.txt | notices_name uniffi dbus-java-core
unzip -p $packages/tabfinder-android.apk assets/THIRD-PARTY-NOTICES.txt | notices_name uniffi activity-compose
cd $packages && for artifact in *; do sha256sum "$artifact" > "$artifact.sha256"; done
"""

[tasks."smoke:tabfinder"]
run = """
fresh_home=$(mktemp -d)
tar -xzf build/package/tabfinder-linux-x86_64.tar.gz -C $fresh_home
exit_code=0
env -i HOME=$fresh_home DISPLAY=$DISPLAY XAUTHORITY=${XAUTHORITY:-} timeout 20 $fresh_home/TabFinder/bin/TabFinder > $fresh_home/output.txt 2>&1 || exit_code=$?
cat $fresh_home/output.txt
threw=0
grep -q "Exception in thread" $fresh_home/output.txt && threw=1
rm -rf $fresh_home
if [ $exit_code -ne 124 ]; then echo "TabFinder quit within 20 s (exit $exit_code)" >&2; exit 1; fi
if [ $threw -eq 1 ]; then echo "TabFinder threw an uncaught exception" >&2; exit 1; fi
"""

[tasks."release-checks:tabfinder"]
run = "apps/tabfinder/release-checks.sh"

[tasks."bench:tabfinder"]
run = "cargo test --release --locked -p mt-tabfinder-presentation --test library_screen -- --ignored"

[tasks."test:android"]
run = """
results=apps/tabfinder/ui/android/build/outputs/androidTest-results/connected
rm -rf $results
./gradlew connectedCheck || exit 1
devices=$(adb devices | grep -c "device$")
[ -n "${ANDROID_SERIAL:-}" ] && devices=1
reports=$(find $results -name 'TEST-*.xml' | wc -l)
if [ "$reports" -ne "$devices" ]; then echo "Android tests ran on $reports of $devices devices; see the install errors above" >&2; exit 1; fi
if find $results -name 'TEST-*.xml' -exec grep -l '<testsuite[^>]* tests="0"' {} + | grep -q .; then echo "A device ran no Android tests" >&2; exit 1; fi
"""
